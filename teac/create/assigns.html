<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignment Creator</title>
    <link rel="stylesheet" href="assigns.css" />
  </head>
  <body>
    <main>
      <h1 class="header-title">
        Assignment Creator
        <button id="prepobtn" class="btn btn-gray">Preview</button>
      </h1>

      <!-- Metadata Section -->
      <div class="assignment-meta">
        <div class="meta-group">
          <label for="assignment-title">Assignment Title</label>
          <input
            type="text"
            id="assignment-title"
            class="meta-input"
            placeholder="e.g. Midterm Physics Quiz"
            autocomplete="off"
          />
        </div>
        <div class="meta-group">
          <label for="assignment-due">Due Date</label>
          <input type="date" id="assignment-due" class="meta-input" />
        </div>
        <div class="meta-group">
          <label for="assignment-points">Total Points</label>
          <input
            type="number"
            id="assignment-points"
            class="meta-input"
            placeholder="100"
            value="100"
          />
        </div>
      </div>

      <!-- Question List Container -->
      <div id="questions-wrapper">
        <div id="empty-state" class="empty-state">
          No questions added yet. Click "+ Add Question" below to start.
        </div>
        <div id="container"></div>
      </div>

      <div class="add-btn-container">
        <button id="add-question" title="Add a new question!">
          + Add Question
        </button>
      </div>

      <!-- Deploy Button Container -->
      <div class="deploy-container">
        <button id="deploy-btn" class="btn btn-deploy">
          Deploy and Send
        </button>
      </div>

      <!-- Proceed / Deployment Success View -->
      <div id="proceed-page">
        <h2>Assignment Ready for Deployment</h2>
        <p id="deploy-summary-text">
          Your assignment has been validated and generated.
        </p>
        <button id="back-to-edit" class="btn btn-gray">← Back to Editor</button>
      </div>
    </main>

    <script type="module" src="assigns.js"></script>
  </body>
</html>
